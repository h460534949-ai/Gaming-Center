<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guess - Game Zone</title>
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message {
            height: 28px;
            font-size: 15px;
            color: #ff6666;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .board-wordle {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tile {
            width: 56px;
            height: 56px;
            border: 2px solid #2a2a4a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: #1a1a2e;
        }

        .tile.filled {
            border-color: #555;
            animation: popTile 0.1s ease;
        }

        .tile.correct {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .tile.present {
            background: #f39c12;
            border-color: #f39c12;
        }

        .tile.absent {
            background: #3a3a5a;
            border-color: #3a3a5a;
        }

        .tile.reveal {
            animation: flipIn 0.4s ease;
        }

        @keyframes popTile {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes flipIn {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .row.shake {
            animation: shake 0.4s ease;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .kb-row {
            display: flex;
            gap: 5px;
        }

        .key {
            min-width: 32px;
            height: 48px;
            background: #2a2a4a;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            text-transform: uppercase;
            padding: 0 8px;
        }

        .key:hover {
            background: #3a3a5a;
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.wide {
            min-width: 64px;
            font-size: 12px;
        }

        .key.correct { background: #2ecc71; }
        .key.present { background: #f39c12; }
        .key.absent { background: #1a1a2e; color: #555; }

        .word-info {
            margin-top: 16px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box .stat-val {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-box .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
        }

        .hint-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hint-btn {
            padding: 6px 14px;
            background: #2a2a4a;
            border: 2px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint-btn:hover:not(:disabled) {
            border-color: #9b59b6;
            background: #3a3a5a;
        }

        .hint-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hint-btn .hint-count {
            background: #9b59b6;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .coins-earned {
            color: #ffd700;
            font-weight: 700;
            font-size: 16px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .tile {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .key {
                min-width: 26px;
                height: 44px;
                font-size: 12px;
                padding: 0 5px;
            }

            .key.wide {
                min-width: 48px;
                font-size: 10px;
            }
        }
    </style>
</head>

    <a href="index.html" class="back-link">&#8592; Back to Games</a>

        <div class="message" id="message"></div>

        <div class="board-wordle" id="board"></div>

        <div class="keyboard" id="keyboard"></div>

        <!-- Hint buttons -->
        <div class="hint-bar">
            <button class="hint-btn" id="hintRevealBtn" disabled>

            </button>
            <button class="hint-btn" id="hintPositionBtn" disabled>

        </div>

        <div class="word-info" id="wordInfo"></div>

        <div style="margin-top: 16px;">
            <button class="game-btn" id="newWordBtn">New Word</button>
        </div>
    </div>

            'wacky','waded','wager','wages','wagon','waist','watch','water','waved','waver',
            'waxen','weary','weave','wedge','weedy','weigh','weird','welch','wench','whack',
            'whale','wharf','wheat','wheel','where','which','while','whiff','whine','whiny',
            'whirl','whisk','white','whole','whose','widen','wider','widow','width','wield',
            'willy','wimpy','wince','winch','windy','witch','witty','woken','woman','women',
            'woody','wordy','world','worms','worry','worse','worst','worth','would','wound',
            'wrack','wrath','wreak','wreck','wrest','wring','write','wrong','wrote','wryly',
            // X
            'xenon',
            // Y
            'yacht','yearn','yeast','yield','young','youth','yummy',
            // Z
            'zebra','zesty','zippy','zonal','zooms'
        ];

        const WORD_LENGTH = 5;
        const MAX_GUESSES = 6;

        let targetWord = '';
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        let grid = [];
        let keyStates = {};
        let wins = parseInt(localStorage.getItem('wordleWins') || '0');
        let streak = parseInt(localStorage.getItem('wordleStreak') || '0');
        let pendingTimeouts = []; // Track all pending timeouts for cleanup
        let generation = 0; // Generation counter to invalidate stale callbacks
        let isAnimating = false; // Lock input during guess reveal animation

        // Currency & Inventory system
        const COINS_KEY = 'gamezone_coins';
        const INVENTORY_KEY = 'gamezone_inventory';
        const WIN_COINS = 40;
        const LOSE_COINS = 10;

        function getCoins() { return parseInt(localStorage.getItem(COINS_KEY) || '0'); }
        function addCoins(amount) {
            localStorage.setItem(COINS_KEY, (getCoins() + amount).toString());
            updateCoinsDisplay();
        }
        function getInventory() { return JSON.parse(localStorage.getItem(INVENTORY_KEY) || '{}'); }
        function useItem(itemId) {
            const inv = getInventory();
            if (inv[itemId] && inv[itemId] > 0) {
                inv[itemId]--;
                localStorage.setItem(INVENTORY_KEY, JSON.stringify(inv));
                return true;
            }
            return false;
        }
        function getItemCount(itemId) { return (getInventory()[itemId] || 0); }

        function updateCoinsDisplay() {
            document.getElementById('coinsDisplay').textContent = getCoins();
        }

        function updateHintButtons() {
            const revealBtn = document.getElementById('hintRevealBtn');
            const eliminateBtn = document.getElementById('hintEliminateBtn');
            const positionBtn = document.getElementById('hintPositionBtn');
            const revealCount = getItemCount('hint_reveal');
            const eliminateCount = getItemCount('hint_eliminate');
            const positionCount = getItemCount('hint_position');

            document.getElementById('revealCount').textContent = revealCount;
            document.getElementById('eliminateCount').textContent = eliminateCount;
            document.getElementById('positionCount').textContent = positionCount;

            revealBtn.disabled = revealCount <= 0 || gameOver;
            eliminateBtn.disabled = eliminateCount <= 0 || gameOver;
            positionBtn.disabled = positionCount <= 0 || gameOver;
        }

        const boardEl = document.getElementById('board');
        const keyboardEl = document.getElementById('keyboard');
        const messageEl = document.getElementById('message');
        const winsEl = document.getElementById('winsDisplay');
        const streakEl = document.getElementById('streakDisplay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultTitle = document.getElementById('resultTitle');
        const resultMsg = document.getElementById('resultMsg');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const newWordBtn = document.getElementById('newWordBtn');
        const wordInfoEl = document.getElementById('wordInfo');

        winsEl.textContent = wins;
        streakEl.textContent = streak;
        updateCoinsDisplay();
        updateHintButtons();

        const KB_ROWS = [
            ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
            ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
            ['ENTER', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'BACK']
        ];

        function pickWord() {
            return WORDS[Math.floor(Math.random() * WORDS.length)];
        }

        function initGame() {
            // Increment generation to invalidate ALL stale callbacks
            generation++;
            // Cancel all pending timeouts from previous game
            pendingTimeouts.forEach(id => clearTimeout(id));
            pendingTimeouts = [];
            isAnimating = false;
            targetWord = pickWord();
            currentRow = 0;
            currentCol = 0;
            gameOver = false;
            grid = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
            keyStates = {};
            messageEl.textContent = '';
            wordInfoEl.textContent = '';
            resultOverlay.classList.remove('active');
            buildBoard();
            buildKeyboard();
            updateCoinsDisplay();
            updateHintButtons();
        }

        function buildBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < MAX_GUESSES; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                row.id = `row-${r}`;
                for (let c = 0; c < WORD_LENGTH; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${r}-${c}`;
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            }
        }

        function buildKeyboard() {
            keyboardEl.innerHTML = '';
            KB_ROWS.forEach(row => {
                const kbRow = document.createElement('div');
                kbRow.className = 'kb-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key' + (key === 'ENTER' || key === 'BACK' ? ' wide' : '');
                    btn.textContent = key === 'BACK' ? '⌫' : key;
                    btn.id = `key-${key}`;
                    btn.addEventListener('click', () => handleKey(key));
                    kbRow.appendChild(btn);
                });
                keyboardEl.appendChild(kbRow);
            });
        }

        function shakeRow(rowIndex) {
            const row = document.getElementById(`row-${rowIndex}`);
            if (row) {
                row.classList.add('shake');
                setTimeout(() => row.classList.remove('shake'), 400);
            }
        }

        let lastKeyTime = 0;

        function handleKey(key) {
            // Prevent duplicate key processing (click + keydown events)
            const now = Date.now();
            if (now - lastKeyTime < 50) return;
            lastKeyTime = now;

            if (gameOver || isAnimating) return;

            if (key === 'BACK' || key === 'Backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    grid[currentRow][currentCol] = '';
                    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.textContent = '';
                    tile.classList.remove('filled');
                }
                messageEl.textContent = '';
                return;
            }

            if (key === 'ENTER') {
                if (currentCol < WORD_LENGTH) {
                    messageEl.textContent = 'Not enough letters';
                    return;
                }
                const guess = grid[currentRow].join('');
                if (!WORDS.includes(guess)) {
                    messageEl.textContent = 'Not in word list';
                    shakeRow(currentRow);
                    return;
                }
                messageEl.textContent = '';
                evaluateGuess(guess);
                return;
            }

            if (currentCol < WORD_LENGTH && /^[a-zA-Z]$/.test(key)) {
                const letter = key.toLowerCase();
                grid[currentRow][currentCol] = letter;
                const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                tile.textContent = letter;
                tile.classList.add('filled');
                currentCol++;
            }
        }

        function evaluateGuess(guess) {
            const result = Array(WORD_LENGTH).fill('absent');
            const targetArr = targetWord.split('');
            const guessArr = guess.split('');

            // First pass: correct positions
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guessArr[i] === targetArr[i]) {
                    result[i] = 'correct';
                    targetArr[i] = null;
                    guessArr[i] = null;
                }
            }

            // Second pass: present but wrong position
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guessArr[i] === null) continue;
                const idx = targetArr.indexOf(guessArr[i]);
                if (idx !== -1) {
                    result[i] = 'present';
                    targetArr[idx] = null;
                }
            }

            // Animate reveal
            const revealRow = currentRow;
            const thisGen = generation; // Capture current generation
            isAnimating = true; // Lock input during animation
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${revealRow}-${i}`);
                const t1 = setTimeout(() => {
                    if (thisGen !== generation) return; // Abort if game was reset
                    tile.classList.add('reveal');
                    const t2 = setTimeout(() => {
                        if (thisGen !== generation) return; // Abort if game was reset
                        tile.classList.add(result[i]);
                    }, 200);
                    pendingTimeouts.push(t2);
                }, i * 150);
                pendingTimeouts.push(t1);
            }

            // Update keyboard colors
            for (let i = 0; i < WORD_LENGTH; i++) {
                const letter = guess[i];
                const state = result[i];
                const prev = keyStates[letter];
                if (state === 'correct') {
                    keyStates[letter] = 'correct';
                } else if (state === 'present' && prev !== 'correct') {
                    keyStates[letter] = 'present';
                } else if (!prev) {
                    keyStates[letter] = 'absent';
                }
            }
            updateKeyboard();

            // Check win/lose after animation completes
            const finalTimeout = setTimeout(() => {
                if (thisGen !== generation) return;
                isAnimating = false; // Unlock input
                if (guess === targetWord) {
                    gameOver = true;
                    wins++;
                    streak++;
                    localStorage.setItem('wordleWins', wins.toString());
                    localStorage.setItem('wordleStreak', streak.toString());
                    winsEl.textContent = wins;
                    streakEl.textContent = streak;
                    addCoins(WIN_COINS);
                    resultTitle.textContent = 'You Got It!';
                    resultMsg.innerHTML = `Solved in ${revealRow + 1} guess${revealRow > 0 ? 'es' : ''}!<div class="coins-earned">+${WIN_COINS} 🪙</div>`;
                    resultOverlay.classList.add('active');
                    wordInfoEl.textContent = `The word was: "${targetWord.toUpperCase()}"`;
                    updateHintButtons();
                } else if (revealRow >= MAX_GUESSES - 1) {
                    gameOver = true;
                    streak = 0;
                    localStorage.setItem('wordleStreak', streak.toString());
                    streakEl.textContent = streak;
                    addCoins(LOSE_COINS);
                    resultTitle.textContent = 'Game Over';
                    resultMsg.innerHTML = `The word was: "${targetWord.toUpperCase()}"<div class="coins-earned">+${LOSE_COINS} 🪙</div>`;
                    resultOverlay.classList.add('active');
                    wordInfoEl.textContent = `Better luck next time!`;
                    updateHintButtons();
                } else {
                    currentRow++;
                    currentCol = 0;
                }
            }, WORD_LENGTH * 150 + 300);
            pendingTimeouts.push(finalTimeout);
        }

        function updateKeyboard() {
            Object.keys(keyStates).forEach(letter => {
                const keyEl = document.getElementById(`key-${letter.toUpperCase()}`);
                if (keyEl) {
                    keyEl.className = 'key ' + keyStates[letter];
                }
            });
        }

        // Physical keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleKey('ENTER');
            else if (e.key === 'Backspace') handleKey('BACK');
            else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toLowerCase());
        });

        // ===== Hint Functions =====
        function useRevealHint() {
            if (gameOver || !useItem('hint_reveal')) return;
            // Find unrevealed correct positions
            const unrevealed = [];
            for (let c = 0; c < WORD_LENGTH; c++) {
                // Check if this position already has a correct guess in any row
                let alreadyCorrect = false;
                for (let r = 0; r < currentRow; r++) {
                    if (grid[r][c] === targetWord[c]) {
                        alreadyCorrect = true;
                        break;
                    }
                }
                if (!alreadyCorrect) unrevealed.push(c);
            }
            if (unrevealed.length === 0) {
                messageEl.textContent = 'All positions already revealed!';
                setTimeout(() => { messageEl.textContent = ''; }, 2000);
                updateHintButtons();
                return;
            }
            const pos = unrevealed[Math.floor(Math.random() * unrevealed.length)];
            const letter = targetWord[pos];
            // Place the letter in the current row
            if (currentCol < WORD_LENGTH) {
                grid[currentRow][pos] = letter;
                const tile = document.getElementById(`tile-${currentRow}-${pos}`);
                tile.textContent = letter;
                tile.classList.add('filled');
                tile.style.boxShadow = '0 0 10px rgba(155, 89, 182, 0.5)';
                tile.style.borderColor = '#9b59b6';
                // Adjust currentCol if needed
                if (pos === currentCol) currentCol++;
                messageEl.textContent = `Revealed: position ${pos + 1} is "${letter.toUpperCase()}"`;
            }
            updateHintButtons();
        }

        function useEliminateHint() {
            if (gameOver || !useItem('hint_eliminate')) return;
            // Find letters not in the target word that are still unmarked on keyboard
            const allLetters = 'abcdefghijklmnopqrstuvwxyz';
            const candidates = [];
            for (const ch of allLetters) {
                if (!targetWord.includes(ch) && !keyStates[ch]) {
                    candidates.push(ch);
                }
            }
            if (candidates.length === 0) {
                messageEl.textContent = 'No more letters to eliminate!';
                setTimeout(() => { messageEl.textContent = ''; }, 2000);
                updateHintButtons();
                return;
            }
            const letter = candidates[Math.floor(Math.random() * candidates.length)];
            keyStates[letter] = 'absent';
            const keyEl = document.getElementById(`key-${letter.toUpperCase()}`);
            if (keyEl) {
                keyEl.className = 'key absent';
                keyEl.style.boxShadow = '0 0 8px rgba(155, 89, 182, 0.5)';
            }
            messageEl.textContent = `Eliminated: "${letter.toUpperCase()}" is not in the word`;
            updateHintButtons();
        }

        function usePositionHint() {
            if (gameOver || !useItem('hint_position')) return;
            // Find a position not yet correctly guessed
            const unrevealed = [];
            for (let c = 0; c < WORD_LENGTH; c++) {
                let alreadyCorrect = false;
                for (let r = 0; r < currentRow; r++) {
                    if (grid[r][c] === targetWord[c]) {
                        alreadyCorrect = true;
                        break;
                    }
                }
                if (!alreadyCorrect) unrevealed.push(c);
            }
            if (unrevealed.length === 0) {
                messageEl.textContent = 'All positions already revealed!';
                setTimeout(() => { messageEl.textContent = ''; }, 2000);
                updateHintButtons();
                return;
            }
            const pos = unrevealed[Math.floor(Math.random() * unrevealed.length)];
            const letter = targetWord[pos];
            const half = pos < 3 ? 'first half (A-M)' : 'second half (N-Z)';
            messageEl.textContent = `Position ${pos + 1}: letter is in the ${half}`;
            updateHintButtons();
        }

        // Hint button listeners
        document.getElementById('hintRevealBtn').addEventListener('click', useRevealHint);
        document.getElementById('hintEliminateBtn').addEventListener('click', useEliminateHint);
        document.getElementById('hintPositionBtn').addEventListener('click', usePositionHint);

        // Buttons
        playAgainBtn.addEventListener('click', initGame);
        newWordBtn.addEventListener('click', initGame);

        // Start
        initGame();
    </script>
</body>

</html>
